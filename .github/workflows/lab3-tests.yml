name: Lab 3 tests
on:
  push:
    paths:
      - 'Lab3/**'
      - '.github/workflows/lab3-tests.yml'
  pull_request:
    paths:
      - 'Lab3/**'
      - '.github/workflows/lab3-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: Lab3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
